[pytest]
DJANGO_SETTINGS_MODULE = core.settings.test
python_files = test_*.py *_test.py *_tests.py
# ``--ds=core.settings.test`` is forced here (instead of relying on the
# ``DJANGO_SETTINGS_MODULE`` ini value above) because pipenv pre-loads
# ``.env`` on every invocation, and pytest-django prefers the env var over
# the ini setting. Putting ``--ds=`` in addopts makes it look like an
# explicit command-line flag, which has the highest precedence.
# Run the Playwright suite with ``--ds=core.settings.test_e2e`` to override.
addopts = -ra -q --strict-markers --ds=core.settings.test_e2e
testpaths = apps core api
filterwarnings =
    ignore::DeprecationWarning:django_fsm.*
markers =
    integration: tests that hit the DB and exercise multiple layers
    tenant: tests that need a fresh tenant schema (slow)
    e2e: end-to-end browser tests driven by Playwright (slow, needs `playwright install`)
