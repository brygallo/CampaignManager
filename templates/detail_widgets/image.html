{% load static %}
<label class="form-label fs-7 fw-semibold mb-1">{{ label|capfirst }}</label>
{% if value %}
  <div class="image-input image-input-outline">
    <a href="{{ value.url }}"
       data-image-lightbox
       data-image-src="{{ value.url }}"
       data-image-name="{{ value.name|default:label }}"
       class="image-input-wrapper w-150px h-150px d-block"
       style="background-image: url('{{ value.url }}'); cursor: zoom-in;"
       aria-label="Ampliar imagen"></a>
  </div>
  <div class="d-flex align-items-center gap-2 mt-2 fs-8 text-muted">
    <i data-lucide="image" class="fs-6 text-primary" aria-hidden="true"></i>
    <span class="text-truncate" title="{{ value.name }}">{{ value.name }}</span>
    <a href="{{ value.url }}" target="_blank" rel="noopener"
       class="btn btn-sm btn-light-primary py-1 px-2 ms-auto d-inline-flex align-items-center gap-1"
       aria-label="Abrir original">
      <i data-lucide="external-link" class="fs-5"></i>
      <span>Abrir</span>
    </a>
  </div>
{% else %}
  <div class="image-input image-input-outline image-input-empty image-input-placeholder"
       style="background-image: url('{% static 'assets/media/svg/files/blank-image.svg' %}')">
    <div class="image-input-wrapper w-150px h-150px"></div>
  </div>
  <div class="text-muted fs-8 mt-2">Sin imagen</div>
{% endif %}
