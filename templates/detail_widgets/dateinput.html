<label class="form-label fs-7 fw-semibold mb-1">{{ label|capfirst }}</label>
<div class="input-group input-group-sm">
  <span class="input-group-text bg-light-primary border-0">
    <i class="ki-outline ki-calendar fs-4 text-primary"></i>
  </span>
  <input type="text"
         class="form-control form-control-sm form-control-solid"
         value="{{ value|date:'d/m/Y'|default_if_none:'' }}"
         readonly>
</div>
