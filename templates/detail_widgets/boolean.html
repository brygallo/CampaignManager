<label class="form-label fs-7 fw-semibold mb-1">{{ label|capfirst }}</label>
<div class="form-check form-switch form-check-custom form-check-solid">
  <input class="form-check-input" type="checkbox" {% if value %}checked{% endif %} disabled>
  <span class="form-check-label fw-semibold ms-2 text-gray-700">{{ value|yesno:"Sí,No,—" }}</span>
</div>
