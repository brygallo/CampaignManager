{% load static %}
{% with input_id=field.id_for_label input_name=field.html_name help_id=field.id_for_label|add:"-help" %}
<div class="image-input image-input-outline{% if not file_url %} image-input-empty image-input-placeholder{% endif %}"
     data-kt-image-input="true"
     style="background-image: url('{% static 'assets/media/svg/files/blank-image.svg' %}')">
  <div class="image-input-wrapper w-150px h-150px"
       {% if file_url %}style="background-image: url('{{ file_url }}')"{% endif %}></div>

  <label class="btn btn-icon btn-circle btn-active-color-primary w-25px h-25px bg-body shadow"
         data-kt-image-input-action="change"
         data-bs-toggle="tooltip"
         title="Cambiar imagen">
    <i data-lucide="pencil" class="fs-7"></i>
    <input type="file"
           id="{{ input_id }}"
           name="{{ input_name }}"
           accept=".png, .jpg, .jpeg, .webp"
           aria-label="{{ field.label }}"
           {% if field.field.required and not file_url %}required{% endif %}
           {% if help_id %}aria-describedby="{{ help_id }}"{% endif %}>
    <input type="hidden" name="{{ input_name }}-clear" value="">
  </label>

  <span class="btn btn-icon btn-circle btn-active-color-primary w-25px h-25px bg-body shadow"
        data-kt-image-input-action="cancel"
        data-bs-toggle="tooltip"
        title="Cancelar cambio">
    <i data-lucide="x" class="fs-2"></i>
  </span>

  {% if not field.field.required and file_url %}
    <span class="btn btn-icon btn-circle btn-active-color-primary w-25px h-25px bg-body shadow"
          data-kt-image-input-action="remove"
          data-bs-toggle="tooltip"
          title="Eliminar imagen">
      <i data-lucide="x" class="fs-2"></i>
    </span>
  {% endif %}
</div>
{% if file_url %}
  <div class="d-flex align-items-center gap-2 mt-2 fs-8 text-muted">
    <i data-lucide="image" class="fs-6 text-primary" aria-hidden="true"></i>
    <span class="text-truncate" title="{{ file_name }}">{{ file_name }}</span>
    <a href="{{ file_url }}"
       data-image-lightbox
       data-image-src="{{ file_url }}"
       data-image-name="{{ file_name }}"
       class="btn btn-sm btn-light-primary py-1 px-2 ms-auto d-inline-flex align-items-center gap-1"
       aria-label="Ampliar imagen">
      <i data-lucide="search" class="fs-5"></i>
      <span>Ver</span>
    </a>
  </div>
{% endif %}
{% endwith %}
