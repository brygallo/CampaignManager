{# Generic BoundField render with Metronic / Bootstrap 5 styles. #}
{% if field.field.widget.input_type == "checkbox" %}
  <div class="form-check form-check-custom form-check-solid mt-7">
    {{ field }}
    <label class="form-check-label fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}</label>
  </div>
{% else %}
  <label for="{{ field.id_for_label }}" class="form-label fw-semibold">
    {{ field.label }}{% if field.field.required %} <span class="text-danger">*</span>{% endif %}
  </label>
  {{ field }}
{% endif %}
{% if field.help_text %}
  <div class="form-text text-muted small">{{ field.help_text }}</div>
{% endif %}
{% if field.errors %}
  <div class="text-danger small mt-1">{{ field.errors|join:" · " }}</div>
{% endif %}
