{% load static %}
<div id="kt_app_sidebar" class="app-sidebar flex-column mt-lg-4 ps-2 pe-2 ps-lg-7 pe-lg-4"
     data-kt-drawer="true"
     data-kt-drawer-name="app-sidebar"
     data-kt-drawer-activate="{default: true, lg: false}"
     data-kt-drawer-overlay="true"
     data-kt-drawer-width="250px"
     data-kt-drawer-direction="start"
     data-kt-drawer-toggle="#kt_app_sidebar_mobile_toggle">

  <div class="app-sidebar-logo flex-shrink-0 d-none d-md-flex flex-center align-items-center" id="kt_app_sidebar_logo">
    <a href="{% url 'home' %}" class="d-flex align-items-center">
      <span class="symbol symbol-40px me-3">
        <span class="symbol-label bg-white">
          <img src="{{ brand_icon_url }}" class="h-30px" alt="{{ brand_name|default:'Control de Campaña' }}">
        </span>
      </span>
      <div class="d-flex flex-column">
        <span class="fs-5 fw-bolder text-gray-900 lh-1">{{ brand_name|default:"Control de Campaña" }}</span>
      </div>
    </a>
  </div>

  <div class="app-sidebar-menu flex-column-fluid">
    <div id="kt_app_sidebar_menu_wrapper" class="hover-scroll-overlay-y my-5"
         data-kt-scroll="true"
         data-kt-scroll-activate="true"
         data-kt-scroll-height="auto"
         data-kt-scroll-dependencies="#kt_app_sidebar_logo"
         data-kt-scroll-wrappers="#kt_app_sidebar_menu"
         data-kt-scroll-offset="5px">

      <div class="menu menu-column menu-rounded menu-sub-indention fw-semibold px-3"
           id="kt_app_sidebar_menu" data-kt-menu="true" data-kt-menu-expand="false">

        <div class="menu-item">
          <a class="menu-link{% if request.resolver_match.url_name == 'home' %} active{% endif %}" href="{% url 'home' %}">
            <span class="menu-icon"><i class="ki-outline ki-home-2 fs-2"></i></span>
            <span class="menu-title">Inicio</span>
          </a>
        </div>

        {% if user.is_staff %}
          <div class="menu-item">
            <a class="menu-link{% if request.resolver_match.url_name == 'superadmin_home' %} active{% endif %}" href="{% url 'superadmin_home' %}">
              <span class="menu-icon"><i class="ki-outline ki-element-11 fs-2"></i></span>
              <span class="menu-title">Panel administrativo</span>
            </a>
          </div>
        {% endif %}

        {% include "base/sidebar_items.html" with menu=menu_tree %}
      </div>
    </div>
  </div>

  {# Sidebar footer eliminado: el menú de usuario completo (perfil + cerrar sesión) está en el header. #}
</div>
