{% extends "base/base.html" %}

{% block title %}Eliminar {{ object }} | {{ block.super }}{% endblock %}

{% block content %}
<div class="card">
  <div class="card-body p-10 text-center">
    <i class="ki-outline ki-shield-cross text-danger" style="font-size:96px"></i>
    <h2 class="mt-4 mb-2 fw-bolder">¿Eliminar este registro?</h2>
    <p class="mb-6 text-gray-600 fs-5">
      Vas a eliminar:
      <span class="text-dark fw-bold">{{ object }}</span>
    </p>
    <form method="post" class="d-flex justify-content-center gap-3">
      {% csrf_token %}
      {% if site.urls.detail %}
        <a href="{{ site.urls.detail }}" class="btn btn-light">Cancelar</a>
      {% else %}
        <a href="{{ site.urls.list }}" class="btn btn-light">Cancelar</a>
      {% endif %}
      <button type="submit" class="btn btn-danger">
        <i class="ki-outline ki-trash fs-2"></i>Sí, eliminar
      </button>
    </form>
  </div>
</div>
{% endblock %}
