<fieldset class="mb-8">
  {% if title %}
    <div class="mb-5">
      <div class="fw-bold fs-4 text-dark mb-1">{{ title|capfirst }}</div>
      <div class="h-3px w-100 bg-primary"></div>
    </div>
  {% endif %}

  {% for row in fieldset %}
    <div class="row g-5 mb-4">
      {% for field in row.fields %}
        {% if not field.is_hidden %}
          <div class="col-md-{{ field.field.widget.attrs.column|default:row.bs_cols }}">
            {% include "forms/formgroup.html" with field=field %}
          </div>
        {% endif %}
      {% endfor %}
    </div>
  {% endfor %}
</fieldset>
