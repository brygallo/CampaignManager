<div class="cm-choice-list" role="list">
  <button type="button"
          class="cm-choice-card"
          data-tone="primary"
          data-choose-action="visit"
          role="listitem">
    <span class="cm-choice-card__icon">
      <i data-lucide="home" class="text-primary fs-2x" aria-hidden="true"></i>
    </span>
    <span class="cm-choice-card__body">
      <span class="cm-choice-card__title">Visita / levantamiento</span>
      <span class="cm-choice-card__desc">Registra una visita en este punto y opcionalmente ofrece publicidad.</span>
    </span>
    <span class="cm-choice-card__chevron">
      <i data-lucide="arrow-right" class="fs-2" aria-hidden="true"></i>
    </span>
  </button>

  <button type="button"
          class="cm-choice-card"
          data-tone="danger"
          data-choose-action="competitor"
          role="listitem">
    <span class="cm-choice-card__icon">
      <i data-lucide="flag" class="text-danger fs-2x" aria-hidden="true"></i>
    </span>
    <span class="cm-choice-card__body">
      <span class="cm-choice-card__title">Detección de competencia</span>
      <span class="cm-choice-card__desc">Reporta publicidad de la oposición vista en este lugar.</span>
    </span>
    <span class="cm-choice-card__chevron">
      <i data-lucide="arrow-right" class="fs-2" aria-hidden="true"></i>
    </span>
  </button>
</div>
