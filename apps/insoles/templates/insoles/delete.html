{% load humanize %}
<div class="d-flex align-items-center p-5 rounded bg-light-danger border border-danger mb-5">
    <div class="symbol symbol-50 symbol-light mr-4">
        <span class="symbol-label">
            <i class="fas fa-exclamation-triangle text-danger icon-xl"></i>
        </span>
    </div>
    <div>
        <h4 class="font-weight-bolder text-danger mb-1">Confirmar eliminación</h4>
        <p class="text-dark-50 mb-0">
            Estás por eliminar <strong>{{ object }}</strong>. Esta acción es irreversible.
        </p>
    </div>
</div>
