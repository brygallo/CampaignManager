{% load humanize %}
<div class="d-flex align-items-center p-5 rounded bg-light-danger border border-danger mb-5">
    <span class="symbol symbol-50px me-4">
        <span class="symbol-label bg-light-danger">
            <i data-lucide="shield-x" class="fs-2x text-danger"></i>
        </span>
    </span>
    <div>
        <h4 class="fw-bolder text-danger mb-1">{{ delete_heading }}</h4>
        <p class="text-gray-700 mb-0">
            {{ delete_message }}
        </p>
    </div>
</div>

<div class="form-check form-check-custom form-check-solid">
    <input class="form-check-input" type="checkbox" value="1" id="id_confirm_button" name="confirm_button">
    <label class="form-check-label fw-semibold text-gray-800" for="id_confirm_button">
        {{ checkbox_label }}
    </label>
</div>
