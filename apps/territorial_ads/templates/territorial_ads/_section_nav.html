{% comment %}
Cross-navigation between the pages of "Publicidad territorial".
Receives:
  - active: one of "map", "list", "units", "refusals"
{% endcomment %}
<div class="btn-group btn-group-sm" role="group" aria-label="Navegación de publicidad territorial">
  <a href="{% url 'territorial_ads:map' %}"
     class="btn d-flex align-items-center gap-1 {% if active == 'map' %}btn-light-primary active{% else %}btn-light{% endif %}"
     aria-label="Mapa"
     title="Mapa"
     {% if active == 'map' %}aria-current="page"{% endif %}>
    <i data-lucide="map" class="fs-3"></i>
    <span class="d-none d-md-inline">Mapa</span>
  </a>
  <a href="{% url 'site:territorial_ads_physicaladvertisement_listar' %}"
     class="btn d-flex align-items-center gap-1 {% if active == 'list' %}btn-light-primary active{% else %}btn-light{% endif %}"
     aria-label="Solicitudes"
     title="Solicitudes"
     {% if active == 'list' %}aria-current="page"{% endif %}>
    <i data-lucide="rows-3" class="fs-3"></i>
    <span class="d-none d-md-inline">Solicitudes</span>
  </a>
  <a href="{% url 'site:territorial_ads_physicaladvertisementunit_listar' %}"
     class="btn d-flex align-items-center gap-1 {% if active == 'units' %}btn-light-primary active{% else %}btn-light{% endif %}"
     aria-label="Publicidades"
     title="Publicidades"
     {% if active == 'units' %}aria-current="page"{% endif %}>
    <i data-lucide="flag" class="fs-3"></i>
    <span class="d-none d-md-inline">Publicidades</span>
  </a>
  {% if perms.territorial_ads.view_advertisingrefusal %}
    <a href="{% url 'site:territorial_ads_advertisingrefusal_listar' %}"
       class="btn d-flex align-items-center gap-1 {% if active == 'refusals' %}btn-light-primary active{% else %}btn-light{% endif %}"
       aria-label="Rechazos"
       title="Rechazos"
       {% if active == 'refusals' %}aria-current="page"{% endif %}>
      <i data-lucide="x-square" class="fs-3"></i>
      <span class="d-none d-md-inline">Rechazos</span>
    </a>
  {% endif %}
</div>
