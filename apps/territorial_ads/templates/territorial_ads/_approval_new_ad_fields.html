{% comment %}
One "new advertisement" row. Shared by server-rendered submitted rows
(``entry`` set, real ``index``) and the JS clone source (``entry`` empty,
``index`` = ``__I__`` placeholder replaced on the client).
Context: index, entry, types, sizes.
{% endcomment %}
<div class="card card-bordered mb-4" data-new-ad-row>
  <div class="card-body p-5">
    <div class="d-flex align-items-center justify-content-between mb-4">
      <div class="fw-bold fs-6 text-dark">Nueva publicidad</div>
      <button type="button" class="btn btn-sm btn-icon btn-light-danger" data-remove-new-ad aria-label="Quitar publicidad">
        <i data-lucide="trash-2" class="fs-5"></i>
      </button>
    </div>
    <div class="row g-5">
      <div class="col-md-8">
        <label class="form-label fs-7 fw-semibold mb-1 required">Tipo de publicidad</label>
        <select name="new_type_{{ index }}" class="form-select form-select-sm form-select-solid" data-new-ad-type>
          <option value="">Selecciona un tipo…</option>
          {% for type in types %}
            <option value="{{ type.pk }}"{% if entry and entry.type_id == type.pk|stringformat:"s" %} selected{% endif %}>{{ type.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label fs-7 fw-semibold mb-1 required">Cantidad</label>
        <input type="number" name="new_quantity_{{ index }}" min="1" step="1"
               value="{{ entry.quantity|default:1 }}"
               class="form-control form-control-sm form-control-solid">
      </div>
      <div class="col-12">
        <label class="form-label fs-7 fw-semibold mb-1">Tamaño</label>
        <select name="new_size_{{ index }}" class="form-select form-select-sm form-select-solid" data-new-ad-size>
          <option value="">Sin tamaño / asignar luego</option>
          {% for size in sizes %}
            {% if not entry or size.advertisement_type_id|stringformat:"s" == entry.type_id %}
              <option value="{{ size.pk }}" data-type="{{ size.advertisement_type_id }}"{% if entry and entry.size_id == size.pk|stringformat:"s" %} selected{% endif %}>{{ size.advertisement_type.name }} — {{ size.name }}</option>
            {% endif %}
          {% endfor %}
        </select>
      </div>
      <div class="col-12">
        <label class="form-label fs-7 fw-semibold mb-1">Indicaciones</label>
        <textarea name="new_instructions_{{ index }}" rows="2"
                  class="form-control form-control-sm form-control-solid"
                  placeholder="Indica qué se requiere: escalera, andamio, permisos, etc.">{{ entry.instructions }}</textarea>
      </div>
    </div>
  </div>
</div>
