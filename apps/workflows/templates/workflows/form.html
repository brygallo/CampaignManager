{# Modal/Inline form rendered when a transition exposes a `custom.form`. #}
<form id="stateWorkflowForm" method="POST" enctype="multipart/form-data" class="row g-3">
  {% csrf_token %}
  {% block form %}
    {% if form.non_field_errors %}
      <div class="alert alert-danger">{{ form.non_field_errors }}</div>
    {% endif %}
    {% for field in form %}
      <div class="col-md-12">
        {% include "base/_field.html" with field=field %}
      </div>
    {% endfor %}
  {% endblock %}
</form>
