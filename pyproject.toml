[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "*/migrations/*",
    "metronic_html_v8.2.0_demo55",
    "static",
    "staticfiles",
    "media",
]

[tool.ruff.lint]
# Pragmatic baseline: errors, warnings, pyflakes, isort, bugbear, comprehensions,
# Django-specific lints, security smells (bandit subset). No formatting rules
# here — `ruff format` handles that.
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "W",     # pycodestyle warnings
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "DJ",    # flake8-django
    "S",     # flake8-bandit (security)
    "RUF",   # ruff-specific
]
ignore = [
    "E501",  # line too long (formatter handles)
    "S101",  # use of assert (fine in tests)
    "S311",  # non-cryptographic random
    "B008",  # function call in argument default (Django pattern: models.CharField(default=...))
    "DJ001", # nullable string-based fields (legacy models)
]

[tool.ruff.lint.per-file-ignores]
"core/settings/*" = ["F401", "F403", "F405", "E402"]
"**/tests/*"      = ["S105", "S106"]
"conftest.py"     = ["S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "core", "api"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
branch = true
source = ["apps", "core", "api"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/management/commands/*",
    "core/settings/*",
    "core/wsgi.py",
    "core/asgi.py",
    "manage.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

