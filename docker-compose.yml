version: "3.8"

services:
  app:
    build: .
    container_name: campaignmanager_app
    env_file: .env
    volumes:
      - .:/src
      - media_volume:/src/media
      - static_volume:/src/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - minio
      - minio-init

  postgres:
    image: postgres:15
    container_name: campaignmanager_postgres
    environment:
      POSTGRES_DB: campaignmanager
      POSTGRES_USER: campaignmanager
      POSTGRES_PASSWORD: campaignmanager
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: campaignmanager_redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: campaignmanager_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: campaignmanager_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${AWS_STORAGE_BUCKET_NAME:-campaignmanager-media}
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing local/"$$MINIO_BUCKET" &&
        echo "[minio-init] bucket $$MINIO_BUCKET listo"

volumes:
  postgres_data:
  media_volume:
  static_volume:
  minio_data:
